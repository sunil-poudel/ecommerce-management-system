spring.application.name=backend
server.servlet.context-path=/api

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# TODO: Update the below properties with your local MySQL credentials
# Note: create a database named ecommerce_backend before running the app
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_backend?useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate Properties
# Update the schema automatically. Use 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT CONFIGURATION
# ===============================
# Defaults to a 256-bit dev key. Override JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 15 minutes
jwt.expirationMs=900000
# 24 hours
jwt.refreshExpirationMs=86400000

# ===============================
# CORS CONFIGURATION
# ===============================
# Comma-separated list of allowed frontend origins.
# Override via CORS_ALLOWED_ORIGINS env var in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# ===============================
# EMAIL / SMTP CONFIGURATION
# ===============================
# Set these environment variables before running the application:
#   SMTP_HOST     - SMTP server hostname (e.g. smtp.gmail.com)
#   SMTP_PORT     - SMTP server port (e.g. 587 for STARTTLS)
#   SMTP_USERNAME - Your SMTP username / email address
#   SMTP_PASSWORD - Your email password or app-specific password
#   SMTP_FROM     - Sender display address (defaults to SMTP_USERNAME)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from=${SMTP_FROM:${SMTP_USERNAME}}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# AI API KEYS
# ===============================
gemini.api.key=${GEMINI_API_KEY:}

# ===============================
# DATABASE BACKUP CONFIGURATION
# ===============================
backup.enabled=${BACKUP_ENABLED:false}
backup.dir=${BACKUP_DIR:./db_backups}
